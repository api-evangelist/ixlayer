aid: ixlayer
name: Ixlayer
description: >-
  Ixlayer is a direct-to-patient healthcare technology company that helps
  biopharmaceutical companies transform the patient experience through an
  integrated, AI-enabled platform. Its unified platform spans virtual patient
  onboarding and intake, telehealth for primary and specialty care, at-home and
  in-center lab testing with mobile phlebotomy, prescription fulfillment
  (retail, specialty, and home delivery), benefits verification and claims,
  connected care with provider directories and scheduling, and the ixAI patient
  concierge for AI-powered support and care coordination. Ixlayer says it has
  powered more than 1,100 nationwide programs and enabled over 4 million patient
  care journeys, and states its services are SOC 2 Type 2, HIPAA, and GDPR
  compliant. The company is backed by General Catalyst.
